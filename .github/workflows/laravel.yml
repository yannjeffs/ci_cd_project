name: Laravel

on:
  push:
    branches: [ "develop" ]
    paths: [ '**' ]
  pull_request:
    branches: [ "develop" ]
    paths: [ '**' ]

jobs:
  install-dependencies:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --verbose

      - name: Cache vendor
        uses: actions/cache/save@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

  copy-env:
    runs-on: ubuntu-latest
    needs: install-dependencies

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache env
        uses: actions/cache/save@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

  generate-key:
    runs-on: ubuntu-latest
    needs: copy-env

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

      - name: Restore env cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

      - name: Generate key
        run: php artisan key:generate

  directory-permissions:
    runs-on: ubuntu-latest
    needs: generate-key

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

  laravel-tests:
    runs-on: ubuntu-latest
    needs: directory-permissions

    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

      - name: Restore env cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute tests via PHPUnit/Pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test