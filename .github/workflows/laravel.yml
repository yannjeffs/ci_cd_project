name: CI — Backend & Frontend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# ─────────────────────────────────────────────────────────────────
#  ANNULER les runs en cours si un nouveau push arrive sur la même
#  branche (évite de gaspiller des minutes CI inutilement)
# ─────────────────────────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Étape 1 : Installation des dépendances PHP
  # ═══════════════════════════════════════════════════════════════
  backend-install:
    name: 🐘 Backend — Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Cache vendor
        uses: actions/cache/save@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Étape 2 : Préparation de l'environnement
  # ═══════════════════════════════════════════════════════════════
  backend-env:
    name: 🐘 Backend — Prepare .env
    runs-on: ubuntu-latest
    needs: backend-install
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache .env
        uses: actions/cache/save@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Étape 3 : Génération de la clé applicative
  # ═══════════════════════════════════════════════════════════════
  backend-key:
    name: 🐘 Backend — Generate app key
    runs-on: ubuntu-latest
    needs: backend-env
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

      - name: Restore .env cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

      - name: Generate application key
        run: php artisan key:generate

  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Étape 4 : Permissions des dossiers
  # ═══════════════════════════════════════════════════════════════
  backend-permissions:
    name: 🐘 Backend — Directory permissions
    runs-on: ubuntu-latest
    needs: backend-key
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set storage & cache permissions
        run: chmod -R 777 storage bootstrap/cache

  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Étape 5 : Tests Laravel (MySQL)
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: 🐘 Backend — PHPUnit / Pest tests
    runs-on: ubuntu-latest
    needs: backend-permissions

    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/vendor
          key: vendor-${{ github.sha }}

      - name: Restore .env cache
        uses: actions/cache/restore@v4
        with:
          path: ./backend/.env
          key: env-${{ github.sha }}

      - name: Generate application key
        run: php artisan key:generate

      - name: Set storage & cache permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test --stop-on-failure

  # ═══════════════════════════════════════════════════════════════
  #  FRONTEND — CI (lint, types, tests, build)
  #  Tourne EN PARALLÈLE du backend dès le début
  # ═══════════════════════════════════════════════════════════════
  frontend-ci:
    name: ⚛️  Frontend — Lint, Tests & Build
    runs-on: ubuntu-latest
    # Pas de "needs" → démarre en même temps que backend-install
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check — TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  DÉPLOIEMENT FRONTEND
  #  Uniquement sur develop, après que le CI frontend soit vert
  # ═══════════════════════════════════════════════════════════════
  frontend-deploy:
    name: 🚀 Frontend — Deploy to O2Switch via FTP
    runs-on: ubuntu-latest
    needs: frontend-ci
    # Ne se déclenche que sur un push direct sur develop (pas sur les PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # ─────────────────────────────────────────────────────────
      #  Déploiement FTP vers O2Switch
      #  Secrets requis dans GitHub → Settings → Secrets :
      #    FTP_HOST     : ex. ftp.ngoune.cdwfs.net
      #    FTP_USERNAME : ton identifiant FTP cPanel
      #    FTP_PASSWORD : ton mot de passe FTP cPanel
      # ─────────────────────────────────────────────────────────
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/ngoune/ci_cd_project/frontend/dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**